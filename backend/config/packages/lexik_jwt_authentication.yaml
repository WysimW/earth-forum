lexik_jwt_authentication:
    secret_key: '%kernel.project_dir%/config/jwt/private.pem' # required for token creation
    public_key: '%kernel.project_dir%/config/jwt/public.pem'  # required for token verification
    pass_phrase: '%env(JWT_PASSPHRASE)%' # required for token creation, usage of an environment variable is recommended
    token_ttl: 86400 # token TTL in seconds, defaults to 3600
    user_id_claim: email # key under which the user identity will be stored in the token payload

