server {
    listen 443 ssl;
    listen [::]:443 ssl ipv6only=on;
    server_name comics-earth.fr www.comics-earth.fr;

    ssl_certificate /etc/letsencrypt/live/comics-earth.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/comics-earth.fr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/earth-forum/frontend/build;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    resolver 127.0.0.53 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    error_page 418 = @prerender;

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map|json|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        if ($prerender = 1) {
            return 418;
        }
        try_files $uri $uri/ /index.html;
    }

    location @prerender {
        include /etc/nginx/snippets/prerender-proxy.conf;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name comics-earth.fr www.comics-earth.fr;
    return 301 https://$host$request_uri;
}
