# Détection bots / crawlers sociaux pour Prerender.io (contexte http)
map $http_user_agent $prerender_bot {
    default 0;
    ~*Prerender 0;
    ~*googlebot|bingbot|yandex|baiduspider|duckduckbot|applebot|petalbot 1;
    ~*facebookexternalhit|facebot|twitterbot|linkedinbot|pinterest|slackbot 1;
    ~*discordbot|telegrambot|whatsapp|embedly|rogerbot|outbrain 1;
}

map $args $prerender_fragment {
    default 0;
    ~_escaped_fragment_ 1;
}

map $uri $prerender_page {
    default 1;
    ~*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map|json|xml|txt|webp|pdf)$ 0;
}

map "$prerender_bot$prerender_fragment" $prerender_candidate {
    default 0;
    ~1 1;
}

map "$prerender_candidate$prerender_page" $prerender {
    default 0;
    "11" 1;
}
