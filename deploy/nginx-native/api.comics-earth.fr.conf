server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.comics-earth.fr;

    ssl_certificate /etc/letsencrypt/live/comics-earth.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/comics-earth.fr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/earth-forum/backend/public;
    index index.php;

    client_max_body_size 20M;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 300;
        fastcgi_send_timeout 300;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name api.comics-earth.fr;
    return 301 https://$host$request_uri;
}
