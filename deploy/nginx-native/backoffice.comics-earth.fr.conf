server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name backoffice.comics-earth.fr;

    ssl_certificate /etc/letsencrypt/live/comics-earth.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/comics-earth.fr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/earth-forum/frontend-backoffice/build;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name backoffice.comics-earth.fr;
    return 301 https://$host$request_uri;
}
