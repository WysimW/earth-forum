; Configuration pour les uploads d'avatar
upload_max_filesize = 10M
post_max_size = 20M
max_file_uploads = 20
memory_limit = 256M

; Timeout pour éviter les timeouts sur les gros fichiers
max_execution_time = 120
max_input_time = 120

; Gestion des erreurs
display_errors = On
log_errors = On
error_log = /var/log/php_errors.log 