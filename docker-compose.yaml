version: "3.8"
services:
    # Mysql database container
    db:
        image: mysql
        container_name: db_symfony
        restart: always
        volumes:
            - db-data:/var/lib/mysql
        environment:
            MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        networks:
            - forum

    # phpmyadmin container
    phpmyadmin:
        image: phpmyadmin
        container_name: forum_phpmyadmin
        restart: always
        depends_on:
            - db
        ports:
            - 8080:80
        environment:
            PMA_HOST: db
        networks:
            - forum

    # PHP-FPM container
    php:
        build: docker/php
        container_name: symfony
        volumes:
            - ./backend:/var/www/html
        restart: always
        networks:
            - forum

    # Nginx web server
    nginx:
        image: nginx:alpine
        container_name: nginx_symfony
        ports:
          - "8741:80"
        volumes:
            - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
            - ./backend:/var/www/html
        depends_on:
            - php
        restart: always
        networks:
            - forum


networks:
    forum:

volumes:
    db-data: